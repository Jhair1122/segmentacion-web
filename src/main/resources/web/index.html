<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segmentación de Contribuyentes | Pangoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.27.1.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #e0f0e0 0%, #c8e0c8 100%);
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
        }
        .glass-card {
            max-width: 1300px;
            margin: 0 auto;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.25);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(105deg, #0e4b2c 0%, #1a6e3a 100%);
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 3px solid #ffd966;
        }
        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .logo-icon {
            background: #f5f5dc; border-radius: 50%; width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #0e4b2c;
        }
        .title-text h1 { color: white; font-size: 1.7rem; font-weight: 700; }
        .title-text p { color: #d4ecd4; font-size: 0.9rem; }
        .form-grid {
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem;
        }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 600; color: #1f3b2c; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.5px;
        }
        .input-group input, .input-group select {
            padding: 0.7rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 1rem;
            font-size: 0.95rem; background: #fefefe;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #2d6a4f; outline: none; box-shadow: 0 0 0 3px rgba(45,106,79,0.2);
        }
        .btn-modern {
            background: linear-gradient(95deg, #14532d, #1f7a46);
            border: none; color: white; font-weight: 700; padding: 0.8rem;
            border-radius: 2rem; cursor: pointer; font-size: 1rem;
            margin: 0.5rem 2rem 1rem; width: calc(100% - 4rem);
            transition: 0.3s;
        }
        .btn-modern:hover { transform: translateY(-2px); background: linear-gradient(95deg, #0f4624, #186e3a); }
        .result-card {
            margin: 0 2rem 1rem; padding: 1.5rem; border-radius: 1.5rem;
            background: #f9faf9; border-left: 8px solid #2ecc71;
            text-align: center;
        }
        .graph-container { margin: 1rem 2rem 2rem; padding: 1rem; background: #0d1f14; border-radius: 1rem; }
        .footer {
            background: #eaf4ea; padding: 1rem; text-align: center;
            font-size: 0.8rem; color: #2c5e3c; border-top: 1px solid #cde0cd;
        }
        @media (max-width: 720px) {
            body { padding: 1rem; }
            .btn-modern { width: calc(100% - 2rem); margin: 0.5rem 1rem; }
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-chart-pie"></i></div>
            <div class="title-text">
                <h1>Segmentación de Contribuyentes</h1>
                <p>Municipalidad Distrital de Pangoa · K-Means + PCA</p>
            </div>
        </div>
        <div style="color:#e8f0e8;"><i class="fas fa-brain"></i> Clustering con Weka y PCA</div>
    </div>

    <form class="form-grid" id="segmentForm">
        <div class="input-group"><label>Tipo contribuyente</label><select id="tipo"><option value="0">Persona natural</option><option value="1">Persona jurídica</option></select></div>
        <div class="input-group"><label>Frecuencia de pago</label><select id="frecuencia"><option value="0">Puntual</option><option value="1">Con retraso</option><option value="2">Nunca paga</option></select></div>
        <div class="input-group"><label>Monto impuesto (S/.)</label><input type="number" step="any" id="montoImpuesto" value="1000"></div>
        <div class="input-group"><label>Monto pagado (S/.)</label><input type="number" step="any" id="montoPagado" value="500"></div>
        <div class="input-group"><label>Deuda acumulada (S/.)</label><input type="number" step="any" id="deudaAcumulada" value="200"></div>
        <div class="input-group"><label>Años en morosidad</label><input type="number" id="aniosMoroso" value="0"></div>
        <div class="input-group"><label>Meses retraso promedio</label><input type="number" step="any" id="mesesRetraso" value="0"></div>
        <div class="input-group"><label>N° notificaciones</label><input type="number" id="numNotificaciones" value="0"></div>
        <div class="input-group"><label>Respondió notificaciones</label><select id="respondio"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div class="input-group"><label>Solicitó fraccionamiento</label><select id="fraccion"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div class="input-group"><label>Año último pago</label><input type="number" id="ultimoPago" value="2024"></div>
    </form>

    <button id="btnSegmentar" class="btn-modern"><i class="fas fa-chart-line"></i> Identificar segmento</button>

    <div id="resultado" class="result-card">✨ Complete los datos y presione el botón</div>
    <div id="grafico" class="graph-container"></div>
    <div class="footer">
        <span><i class="fas fa-microchip"></i> Weka · K-Means · PCA</span>
        <span><i class="fas fa-chart-pie"></i> Segmentación en 4 grupos</span>
        <span><i class="fas fa-shield-alt"></i> Datos reales</span>
    </div>
</div>

<script>
    let puntosData = null;
    let graficoDiv = document.getElementById('grafico');
    let resultadoDiv = document.getElementById('resultado');

    // Función para calcular centroide y radio (basado en desviación estándar)
    function calcularCirculo(puntos) {
        if (!puntos.x || puntos.x.length === 0) return null;
        let sumX = 0, sumY = 0;
        for (let i = 0; i < puntos.x.length; i++) {
            sumX += puntos.x[i];
            sumY += puntos.y[i];
        }
        const cx = sumX / puntos.x.length;
        const cy = sumY / puntos.y.length;
        // Calcular distancia al centroide para cada punto
        let cuadrados = [];
        for (let i = 0; i < puntos.x.length; i++) {
            const dx = puntos.x[i] - cx;
            const dy = puntos.y[i] - cy;
            cuadrados.push(dx*dx + dy*dy);
        }
        const varianza = cuadrados.reduce((a,b) => a+b, 0) / puntos.x.length;
        const desv = Math.sqrt(varianza);
        // Radio = 1.5 * desviación estándar (para cubrir ~85% de los puntos)
        const radio = desv * 1.5;
        return { cx, cy, r: radio };
    }

    async function cargarPuntos() {
        try {
            const resp = await fetch('/puntos');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            puntosData = await resp.json();
            console.log('Puntos cargados:', Object.keys(puntosData).length, 'clusters');
            // Verificar si hay datos
            let algunClusterConPuntos = false;
            for (const cluster in puntosData) {
                if (puntosData[cluster].x && puntosData[cluster].x.length > 0) {
                    algunClusterConPuntos = true;
                    break;
                }
            }
            if (!algunClusterConPuntos) {
                resultadoDiv.innerHTML = '<div style="color:#e74c3c;">⚠️ No se encontraron puntos en el gráfico. Verifica el archivo puntos_por_cluster.json.</div>';
                return;
            }
            dibujarGrafico(null, null);
        } catch (err) {
            console.error(err);
            resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error al cargar los datos del gráfico: ${err.message}. Asegúrate de que el backend está corriendo y que /puntos devuelve JSON.</div>`;
        }
    }

    function dibujarGrafico(clusterResaltado, puntoUsuario) {
        if (!puntosData) return;
        const colores = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db'];
        const nombres = ['Segmento 0 (Morosos)', 'Segmento 1 (Recuperables)', 'Segmento 2 (Cumplidos)', 'Segmento 3 (Recuperables alto monto)'];
        
        let shapes = [];
        let traces = [];

        // Primero, calcular los círculos para cada cluster
        for (const [cluster, pts] of Object.entries(puntosData)) {
            const idx = parseInt(cluster);
            if (!pts.x || pts.x.length === 0) continue;
            const circulo = calcularCirculo(pts);
            if (!circulo) continue;
            const color = colores[idx % colores.length];
            const { cx, cy, r } = circulo;
            
            // Grosor del borde: más grueso si es el cluster resaltado
            const lineWidth = (clusterResaltado !== null && idx === clusterResaltado) ? 3 : 1.5;
            const fillOpacity = 0.2;
            
            shapes.push({
                type: 'circle',
                xref: 'x', yref: 'y',
                x0: cx - r, y0: cy - r,
                x1: cx + r, y1: cy + r,
                line: { color: color, width: lineWidth, dash: 'solid' },
                fillcolor: `rgba(${parseInt(color.slice(1,3),16)}, ${parseInt(color.slice(3,5),16)}, ${parseInt(color.slice(5,7),16)}, ${fillOpacity})`,
                layer: 'below'
            });
            
            // Agregar los puntos individuales (opcional, con baja opacidad)
            traces.push({
                x: pts.x,
                y: pts.y,
                mode: 'markers',
                name: nombres[idx],
                marker: { color: color, size: 4, opacity: 0.4 },
                type: 'scatter',
                hoverinfo: 'none',
                showlegend: false
            });
        }
        
        // Punto del usuario si existe
        if (puntoUsuario && typeof puntoUsuario.x === 'number' && typeof puntoUsuario.y === 'number') {
            traces.push({
                x: [puntoUsuario.x],
                y: [puntoUsuario.y],
                mode: 'markers+text',
                name: '⭐ Tú',
                text: ['Tú'],
                textposition: 'top center',
                marker: { symbol: 'star', size: 16, color: '#ffd966', line: { width: 2, color: '#fff' } },
                type: 'scatter',
                hoverinfo: 'text',
                textfont: { size: 12, color: '#fff' }
            });
        }
        
        // Calcular rango automático con un margen del 10%
        let allX = [], allY = [];
        for (const [cluster, pts] of Object.entries(puntosData)) {
            if (pts.x) allX.push(...pts.x);
            if (pts.y) allY.push(...pts.y);
        }
        if (puntoUsuario) {
            allX.push(puntoUsuario.x);
            allY.push(puntoUsuario.y);
        }
        if (allX.length === 0) allX = [0,1];
        if (allY.length === 0) allY = [0,1];
        const xMin = Math.min(...allX);
        const xMax = Math.max(...allX);
        const yMin = Math.min(...allY);
        const yMax = Math.max(...allY);
        const xRange = xMax - xMin;
        const yRange = yMax - yMin;
        const xMargin = xRange * 0.1;
        const yMargin = yRange * 0.1;
        
        const layout = {
            title: 'Mapa de perfiles de contribuyentes (PCA) - Grupos en círculos',
            plot_bgcolor: '#0d1f14', paper_bgcolor: '#0d1f14',
            font: { color: '#a8dfc0' },
            xaxis: { 
                showgrid: true, gridcolor: 'rgba(255,255,255,0.1)', 
                zeroline: false, showticklabels: false,
                range: [xMin - xMargin, xMax + xMargin]
            },
            yaxis: { 
                showgrid: true, gridcolor: 'rgba(255,255,255,0.1)', 
                zeroline: false, showticklabels: false,
                range: [yMin - yMargin, yMax + yMargin]
            },
            height: 500,
            margin: { l: 30, r: 30, t: 50, b: 40 },
            hovermode: 'closest',
            shapes: shapes
        };
        Plotly.newPlot(graficoDiv, traces, layout, { responsive: true });
    }

    async function segmentar() {
        const btn = document.getElementById('btnSegmentar');
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Procesando...';
        btn.disabled = true;

        const datos = {
            tipoContribuyente: parseInt(document.getElementById('tipo').value),
            frecuenciaPago: parseInt(document.getElementById('frecuencia').value),
            montoImpuesto: parseFloat(document.getElementById('montoImpuesto').value),
            montoPagado: parseFloat(document.getElementById('montoPagado').value),
            deudaAcumulada: parseFloat(document.getElementById('deudaAcumulada').value),
            aniosMoroso: parseInt(document.getElementById('aniosMoroso').value),
            mesesRetrasoPromedio: parseFloat(document.getElementById('mesesRetraso').value),
            numNotificaciones: parseInt(document.getElementById('numNotificaciones').value),
            respondioNotificacion: parseInt(document.getElementById('respondio').value),
            fraccionamiento: parseInt(document.getElementById('fraccion').value),
            ultimoPago: parseInt(document.getElementById('ultimoPago').value)
        };

        if (datos.montoPagado > datos.montoImpuesto && datos.montoImpuesto > 0) {
            resultadoDiv.innerHTML = '<div style="color:#c5221f;">⚠️ El monto pagado no puede superar al impuesto.</div>';
            btn.innerHTML = '<i class="fas fa-chart-line"></i> Identificar segmento';
            btn.disabled = false;
            return;
        }

        try {
            const response = await fetch('/segmentar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (!response.ok) throw new Error('Error en el servidor');
            const res = await response.json();
            if (res.error) throw new Error(res.error);

            const info = res.info;
            const nombre = info.nombre || `Segmento ${res.cluster}`;
            const desc = info.descripcion || '';
            const accion = info.accion || 'Revisar historial.';
            const caracteristicas = info.caracteristicas || [];
            let caracHtml = '';
            if (caracteristicas.length) {
                caracHtml = '<ul style="text-align:left;display:inline-block;margin:10px 0;">' +
                    caracteristicas.map(c => `<li>${c}</li>`).join('') + '</ul>';
            }
            resultadoDiv.innerHTML = `
                <h2 style="color:#1f7a46;">${nombre}</h2>
                <p>${desc}</p>
                ${caracHtml}
                <p><strong>⚡ Acción recomendada:</strong> ${accion}</p>
                <p style="font-size:0.8rem;margin-top:0.5rem;">Cluster #${res.cluster}</p>
            `;
            // Verificar si el backend devolvió pcaX y pcaY
            if (typeof res.pcaX === 'number' && typeof res.pcaY === 'number') {
                const puntoUsuario = { x: res.pcaX, y: res.pcaY };
                dibujarGrafico(res.cluster, puntoUsuario);
            } else {
                console.warn('El backend no devolvió pcaX/pcaY, mostrando solo clusters');
                dibujarGrafico(res.cluster, null);
            }
        } catch (err) {
            resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error: ${err.message}</div>`;
        } finally {
            btn.innerHTML = '<i class="fas fa-chart-line"></i> Identificar segmento';
            btn.disabled = false;
        }
    }

    cargarPuntos();
    document.getElementById('btnSegmentar').addEventListener('click', segmentar);
</script>
</body>
</html>
