<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Segmentación de Contribuyentes | Pangoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.27.1.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #e0f0e0 0%, #c8e0c8 100%);
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
        }
        .glass-card {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255,255,255,0.96);
            backdrop-filter: blur(2px);
            border-radius: 2rem;
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(105deg, #0e4b2c 0%, #1a6e3a 100%);
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 3px solid #ffd966;
        }
        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .logo-icon {
            background: #f5f5dc; border-radius: 50%; width: 55px; height: 55px;
            display: flex; align-items: center; justify-content: center;
            font-size: 2rem; color: #0e4b2c;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .title-text h1 { color: white; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.3px; }
        .title-text p { color: #d4ecd4; font-size: 0.9rem; font-weight: 500; }
        .form-grid {
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem 1.5rem;
        }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label {
            font-weight: 700; color: #1f3b2c; font-size: 0.75rem;
            text-transform: uppercase; letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .input-group input, .input-group select {
            padding: 0.75rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 1rem;
            font-size: 0.95rem; background: #fefefe;
            transition: all 0.2s;
        }
        .input-group input:focus, .input-group select:focus {
            border-color: #2d6a4f; outline: none; box-shadow: 0 0 0 3px rgba(45,106,79,0.2);
        }
        .btn-modern {
            background: linear-gradient(95deg, #14532d, #1f7a46);
            border: none; color: white; font-weight: 800; padding: 0.9rem;
            border-radius: 2rem; cursor: pointer; font-size: 1rem;
            margin: 0.5rem 2rem 1rem; width: calc(100% - 4rem);
            transition: 0.3s;
            box-shadow: 0 6px 14px rgba(0,0,0,0.15);
        }
        .btn-modern:hover {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #0f4624, #186e3a);
            box-shadow: 0 12px 22px rgba(0,0,0,0.2);
        }
        .btn-secondary {
            background: linear-gradient(95deg, #2c6e4f, #1f7a46);
            width: auto;
            padding: 0.7rem 1.2rem;
            margin: 0 1rem;
            font-size: 0.9rem;
        }
        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 0.5rem 2rem 0;
        }
        .result-card {
            margin: 0 2rem 1rem; padding: 1.5rem; border-radius: 1.5rem;
            background: #f9faf9; border-left: 8px solid #2ecc71;
            text-align: center;
            transition: transform 0.2s;
        }
        .result-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .graph-container { margin: 1rem 2rem 2rem; padding: 1rem; background: #0d1f14; border-radius: 1.5rem; }
        .footer {
            background: #eaf4ea; padding: 1rem; text-align: center;
            font-size: 0.8rem; color: #2c5e3c; border-top: 1px solid #cde0cd;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        @media (max-width: 720px) {
            body { padding: 1rem; }
            .btn-modern { width: calc(100% - 2rem); margin: 0.5rem 1rem; }
            .form-grid { padding: 1rem; }
            .graph-container { margin: 1rem; }
            .button-group { margin: 0.5rem 1rem; }
        }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-chart-pie"></i></div>
            <div class="title-text">
                <h1>Segmentación de Contribuyentes</h1>
                <p>Municipalidad Distrital de Pangoa · K-Means + PCA · Análisis inteligente</p>
            </div>
        </div>
        <div style="color:#e8f0e8; font-weight:600;"><i class="fas fa-brain"></i> Clustering con Weka</div>
    </div>

    <form class="form-grid" id="segmentForm">
        <div class="input-group"><label><i class="fas fa-user"></i> Tipo contribuyente</label><select id="tipo"><option value="0">Persona natural</option><option value="1">Persona jurídica</option></select></div>
        <div class="input-group"><label><i class="fas fa-calendar-alt"></i> Frecuencia de pago</label><select id="frecuencia"><option value="0">Puntual</option><option value="1">Con retraso</option><option value="2">Nunca paga</option></select></div>
        <div class="input-group"><label><i class="fas fa-money-bill-wave"></i> Monto impuesto (S/.)</label><input type="number" step="any" id="montoImpuesto" value="1000"></div>
        <div class="input-group"><label><i class="fas fa-hand-holding-usd"></i> Monto pagado (S/.)</label><input type="number" step="any" id="montoPagado" value="500"></div>
        <div class="input-group"><label><i class="fas fa-chart-line"></i> Deuda acumulada (S/.)</label><input type="number" step="any" id="deudaAcumulada" value="200"></div>
        <div class="input-group"><label><i class="fas fa-hourglass-half"></i> Años en morosidad</label><input type="number" id="aniosMoroso" value="0"></div>
        <div class="input-group"><label><i class="fas fa-clock"></i> Meses retraso promedio</label><input type="number" step="any" id="mesesRetraso" value="0"></div>
        <div class="input-group"><label><i class="fas fa-envelope"></i> N° notificaciones</label><input type="number" id="numNotificaciones" value="0"></div>
        <div class="input-group"><label><i class="fas fa-reply-all"></i> Respondió notificaciones</label><select id="respondio"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div class="input-group"><label><i class="fas fa-file-signature"></i> Solicitó fraccionamiento</label><select id="fraccion"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div class="input-group"><label><i class="fas fa-calendar-week"></i> Año último pago</label><input type="number" id="ultimoPago" value="2024"></div>
    </form>

    <div class="button-group">
        <button id="btnSegmentar" class="btn-modern"><i class="fas fa-chart-line"></i> Identificar segmento</button>
        <button id="btnEjemplo" class="btn-modern btn-secondary"><i class="fas fa-chalkboard-user"></i> Cargar ejemplo (Riesgo Medio)</button>
    </div>

    <div id="resultado" class="result-card">✨ Complete los datos y presione el botón</div>
    <div id="grafico" class="graph-container"></div>
    <div class="footer">
        <span><i class="fas fa-microchip"></i> Modelo Weka · K-Means</span>
        <span><i class="fas fa-chart-pie"></i> Segmentación en 4 grupos</span>
        <span><i class="fas fa-shield-alt"></i> Datos oficiales · Pangoa</span>
    </div>
</div>

<script>
    let puntosData = null;
    let graficoDiv = document.getElementById('grafico');
    let resultadoDiv = document.getElementById('resultado');
    let fixedRanges = null;

    // Colores y nombres
    const COLORES = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db'];
    const NOMBRES = [
        'Segmento 0: Morosos',
        'Segmento 1: Recuperables',
        'Segmento 2: Cumplidos',
        'Segmento 3: Recuperables alto monto'
    ];

    // Calcular círculo que contenga todos los puntos (radio = distancia máxima al centroide + margen)
    function calcularCirculo(puntos) {
        if (!puntos.x || puntos.x.length === 0) return null;
        let sumX = 0, sumY = 0;
        for (let i = 0; i < puntos.x.length; i++) {
            sumX += puntos.x[i];
            sumY += puntos.y[i];
        }
        const cx = sumX / puntos.x.length;
        const cy = sumY / puntos.y.length;
        let maxDist = 0;
        for (let i = 0; i < puntos.x.length; i++) {
            const dx = puntos.x[i] - cx;
            const dy = puntos.y[i] - cy;
            const dist = Math.hypot(dx, dy);
            if (dist > maxDist) maxDist = dist;
        }
        // Margen del 20% para que el círculo sea más grande y se vea como un grupo
        const radio = maxDist * 1.2;
        return { cx, cy, r: Math.max(radio, 0.5) };
    }

    // Cargar puntos desde el backend
    async function cargarPuntos() {
        try {
            const resp = await fetch('/puntos');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            puntosData = await resp.json();
            console.log('Puntos cargados:', Object.keys(puntosData).length, 'clusters');
            
            let algunCluster = false;
            for (const c in puntosData) {
                if (puntosData[c].x && puntosData[c].x.length > 0) {
                    algunCluster = true;
                    break;
                }
            }
            if (!algunCluster) {
                resultadoDiv.innerHTML = '<div style="color:#e74c3c;">⚠️ No hay datos de puntos. Verifica puntos_por_cluster.json</div>';
                return;
            }
            
            // Calcular rangos fijos incluyendo todos los puntos y los círculos
            let allX = [], allY = [];
            for (const pts of Object.values(puntosData)) {
                if (pts.x) {
                    allX.push(...pts.x);
                    allY.push(...pts.y);
                }
                const circulo = calcularCirculo(pts);
                if (circulo) {
                    allX.push(circulo.cx - circulo.r, circulo.cx + circulo.r);
                    allY.push(circulo.cy - circulo.r, circulo.cy + circulo.r);
                }
            }
            if (allX.length === 0) allX = [0,1];
            if (allY.length === 0) allY = [0,1];
            const xMin = Math.min(...allX);
            const xMax = Math.max(...allX);
            const yMin = Math.min(...allY);
            const yMax = Math.max(...allY);
            const xRange = xMax - xMin;
            const yRange = yMax - yMin;
            const xMargin = xRange * 0.15;
            const yMargin = yRange * 0.15;
            fixedRanges = {
                x: [xMin - xMargin, xMax + xMargin],
                y: [yMin - yMargin, yMax + yMargin]
            };
            // Dibujar gráfico inicial sin usuario
            dibujarGrafico(null, null);
        } catch (err) {
            console.error(err);
            resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error cargando gráfico: ${err.message}</div>`;
        }
    }

    // Dibujar gráfico con círculos, puntos y estrella
    function dibujarGrafico(clusterResaltado, puntoUsuario) {
        if (!puntosData) return;
        
        let shapes = [];
        let traces = [];
        
        // 1. Círculos para cada cluster
        for (const [cluster, pts] of Object.entries(puntosData)) {
            const idx = parseInt(cluster);
            if (!pts.x || pts.x.length === 0) continue;
            const circulo = calcularCirculo(pts);
            if (!circulo) continue;
            const color = COLORES[idx % COLORES.length];
            const isHighlighted = (clusterResaltado !== null && idx === clusterResaltado);
            const lineWidth = isHighlighted ? 3.5 : 2;
            const fillOpacity = isHighlighted ? 0.25 : 0.15;
            
            shapes.push({
                type: 'circle',
                xref: 'x', yref: 'y',
                x0: circulo.cx - circulo.r,
                y0: circulo.cy - circulo.r,
                x1: circulo.cx + circulo.r,
                y1: circulo.cy + circulo.r,
                line: { color: color, width: lineWidth },
                fillcolor: `rgba(${parseInt(color.slice(1,3),16)}, ${parseInt(color.slice(3,5),16)}, ${parseInt(color.slice(5,7),16)}, ${fillOpacity})`,
                layer: 'below'
            });
            
            // Etiqueta del centroide (nombre del cluster)
            traces.push({
                x: [circulo.cx],
                y: [circulo.cy],
                mode: 'text',
                text: [`<b>${NOMBRES[idx].split(':')[0]}</b>`],
                textfont: { size: 11, color: color },
                showlegend: false,
                hoverinfo: 'skip',
                type: 'scatter'
            });
        }
        
        // 2. Nubes de puntos
        for (const [cluster, pts] of Object.entries(puntosData)) {
            const idx = parseInt(cluster);
            if (!pts.x || pts.x.length === 0) continue;
            const color = COLORES[idx % COLORES.length];
            const isHighlighted = (clusterResaltado !== null && idx === clusterResaltado);
            const markerSize = isHighlighted ? 8 : 5;
            const markerOpacity = isHighlighted ? 0.9 : 0.6;
            traces.push({
                x: pts.x,
                y: pts.y,
                mode: 'markers',
                name: NOMBRES[idx],
                marker: { color: color, size: markerSize, opacity: markerOpacity, line: { width: 0.3, color: 'white' } },
                type: 'scatter',
                hoverinfo: 'text',
                text: pts.x.map(() => NOMBRES[idx]),
                legendgroup: `cluster${idx}`
            });
        }
        
        // 3. Estrella del usuario
        if (puntoUsuario && typeof puntoUsuario.x === 'number' && typeof puntoUsuario.y === 'number') {
            // Verificar si está dentro del rango visible
            const inRange = fixedRanges && 
                puntoUsuario.x >= fixedRanges.x[0] && puntoUsuario.x <= fixedRanges.x[1] &&
                puntoUsuario.y >= fixedRanges.y[0] && puntoUsuario.y <= fixedRanges.y[1];
            
            traces.push({
                x: [puntoUsuario.x],
                y: [puntoUsuario.y],
                mode: 'markers+text',
                name: '⭐ Contribuyente actual',
                text: ['  Tú'],
                textposition: 'middle right',
                textfont: { size: 12, color: '#ffd966', weight: 'bold' },
                marker: { symbol: 'star', size: 22, color: '#ffd966', line: { width: 2, color: '#fff' } },
                type: 'scatter',
                hoverinfo: 'text',
                hovertemplate: '⭐ Tu ubicación<br>PC1: %{x:.2f}<br>PC2: %{y:.2f}<extra></extra>',
                legendgroup: 'usuario'
            });
            
            if (!inRange) {
                console.warn('⚠️ La estrella está fuera del rango visible. Coordenadas:', puntoUsuario);
            }
        }
        
        const layout = {
            title: {
                text: 'Mapa de perfiles de contribuyentes (PCA) - Grupos circulares',
                font: { size: 16, color: '#a8dfc0', weight: 'bold' },
                x: 0.5,
                xanchor: 'center'
            },
            plot_bgcolor: '#0d1f14',
            paper_bgcolor: '#0d1f14',
            font: { color: '#a8dfc0' },
            xaxis: {
                title: 'Componente Principal 1',
                showgrid: true,
                gridcolor: 'rgba(255,255,255,0.08)',
                zeroline: false,
                showticklabels: true,
                tickfont: { size: 10 },
                range: fixedRanges ? fixedRanges.x : undefined
            },
            yaxis: {
                title: 'Componente Principal 2',
                showgrid: true,
                gridcolor: 'rgba(255,255,255,0.08)',
                zeroline: false,
                showticklabels: true,
                tickfont: { size: 10 },
                range: fixedRanges ? fixedRanges.y : undefined,
                scaleanchor: 'x',
                scaleratio: 1
            },
            height: 580,
            margin: { l: 70, r: 80, t: 70, b: 70 },
            hovermode: 'closest',
            legend: {
                bgcolor: 'rgba(0,0,0,0.65)',
                bordercolor: 'rgba(255,255,255,0.2)',
                borderwidth: 1,
                font: { size: 11 },
                x: 1.02,
                y: 1,
                xanchor: 'left',
                yanchor: 'top'
            },
            shapes: shapes
        };
        Plotly.newPlot(graficoDiv, traces, layout, { responsive: true });
    }
    
    // Función para cargar un ejemplo (caso típico de Riesgo Medio)
    function cargarEjemplo() {
        document.getElementById('tipo').value = "0";
        document.getElementById('frecuencia').value = "1";
        document.getElementById('montoImpuesto').value = "3500";
        document.getElementById('montoPagado').value = "1800";
        document.getElementById('deudaAcumulada').value = "2200";
        document.getElementById('aniosMoroso').value = "2";
        document.getElementById('mesesRetraso').value = "4";
        document.getElementById('numNotificaciones').value = "3";
        document.getElementById('respondio').value = "false"; // No
        document.getElementById('fraccion').value = "true";   // Sí
        document.getElementById('ultimoPago').value = "2022";
        resultadoDiv.innerHTML = "📋 Ejemplo cargado. Ahora presione 'Identificar segmento' para ver el resultado.";
        resultadoDiv.style.borderLeftColor = "#f1c40f";
    }
    
    // Segmentar contribuyente
    async function segmentar() {
        const btn = document.getElementById('btnSegmentar');
        const originalHtml = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Procesando...';
        btn.disabled = true;
        
        const datos = {
            tipoContribuyente: parseInt(document.getElementById('tipo').value),
            frecuenciaPago: parseInt(document.getElementById('frecuencia').value),
            montoImpuesto: parseFloat(document.getElementById('montoImpuesto').value),
            montoPagado: parseFloat(document.getElementById('montoPagado').value),
            deudaAcumulada: parseFloat(document.getElementById('deudaAcumulada').value),
            aniosMoroso: parseInt(document.getElementById('aniosMoroso').value),
            mesesRetrasoPromedio: parseFloat(document.getElementById('mesesRetraso').value),
            numNotificaciones: parseInt(document.getElementById('numNotificaciones').value),
            respondioNotificacion: parseInt(document.getElementById('respondio').value),
            fraccionamiento: parseInt(document.getElementById('fraccion').value),
            ultimoPago: parseInt(document.getElementById('ultimoPago').value)
        };
        
        if (datos.montoPagado > datos.montoImpuesto && datos.montoImpuesto > 0) {
            resultadoDiv.innerHTML = '<div style="color:#c5221f;">⚠️ El monto pagado no puede superar al impuesto.</div>';
            btn.innerHTML = originalHtml;
            btn.disabled = false;
            return;
        }
        
        try {
            const response = await fetch('/segmentar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (!response.ok) throw new Error('Error en el servidor');
            const res = await response.json();
            if (res.error) throw new Error(res.error);
            
            const info = res.info || {};
            const nombre = info.nombre || `Segmento ${res.cluster}`;
            const desc = info.descripcion || '';
            const accion = info.accion || 'Revisar historial.';
            const caracteristicas = info.caracteristicas || [];
            let caracHtml = '';
            if (caracteristicas.length) {
                caracHtml = '<ul style="text-align:left;display:inline-block;margin:12px 0;">' +
                    caracteristicas.map(c => `<li style="margin:6px 0;">${c}</li>`).join('') + '</ul>';
            }
            resultadoDiv.innerHTML = `
                <h2 style="color:#1f7a46; margin-bottom:8px;">${nombre}</h2>
                <p style="margin-bottom:8px;">${desc}</p>
                ${caracHtml}
                <p><strong>⚡ Acción recomendada:</strong> ${accion}</p>
                <p style="font-size:0.8rem; margin-top:12px;">Cluster #${res.cluster}</p>
            `;
            
            // Mostrar estrella si el backend devuelve coordenadas
            if (typeof res.pcaX === 'number' && typeof res.pcaY === 'number') {
                dibujarGrafico(res.cluster, { x: res.pcaX, y: res.pcaY });
                console.log(`⭐ Estrella colocada en (${res.pcaX}, ${res.pcaY}) - Cluster ${res.cluster}`);
            } else {
                console.warn('⚠️ El backend no devolvió pcaX/pcaY. La estrella no se mostrará.');
                dibujarGrafico(res.cluster, null);
            }
        } catch (err) {
            resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error: ${err.message}</div>`;
            console.error(err);
        } finally {
            btn.innerHTML = originalHtml;
            btn.disabled = false;
        }
    }
    
    // Inicializar
    cargarPuntos();
    document.getElementById('btnSegmentar').addEventListener('click', segmentar);
    document.getElementById('btnEjemplo').addEventListener('click', cargarEjemplo);
</script>
</body>
</html>
