<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Segmentación de Contribuyentes | Pangoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.27.1.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Canvas de partículas de fondo */
        #particles-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: linear-gradient(135deg, #e0f0e0 0%, #c8e0c8 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            padding: 2rem 1.5rem;
            min-height: 100vh;
            position: relative;
        }

        .glass-card {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.97);
            backdrop-filter: blur(8px);
            border-radius: 2rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(105deg, #0e4b2c 0%, #1a6e3a 100%);
            padding: 1.2rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            border-bottom: 3px solid #ffd966;
            position: relative;
            z-index: 2;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-icon {
            background: #f5f5dc;
            border-radius: 50%;
            width: 55px;
            height: 55px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: #0e4b2c;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s;
        }

        .logo-icon:hover {
            transform: scale(1.05) rotate(5deg);
        }

        .title-text h1 {
            color: white;
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .title-text p {
            color: #d4ecd4;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .form-grid {
            padding: 1.5rem 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1rem 1.5rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
            transition: transform 0.2s;
        }

        .input-group:hover {
            transform: translateY(-2px);
        }

        .input-group label {
            font-weight: 700;
            color: #1f3b2c;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group input,
        .input-group select {
            padding: 0.75rem 1rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 1rem;
            font-size: 0.95rem;
            background: #fefefe;
            transition: all 0.25s;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #2d6a4f;
            outline: none;
            box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.2);
            transform: scale(1.01);
        }

        .btn-modern {
            background: linear-gradient(95deg, #14532d, #1f7a46);
            border: none;
            color: white;
            font-weight: 800;
            padding: 0.9rem;
            border-radius: 2rem;
            cursor: pointer;
            font-size: 1rem;
            margin: 0.5rem 2rem 1rem;
            width: calc(100% - 4rem);
            transition: all 0.3s;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.15);
            position: relative;
            overflow: hidden;
        }

        .btn-modern::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 300%;
            height: 300%;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            transform: translate(-50%, -50%) scale(0);
            transition: transform 0.4s;
        }

        .btn-modern:active::after {
            transform: translate(-50%, -50%) scale(1);
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            background: linear-gradient(95deg, #0f4624, #186e3a);
            box-shadow: 0 12px 22px rgba(0, 0, 0, 0.2);
        }

        .btn-secondary {
            background: linear-gradient(95deg, #2c6e4f, #1f7a46);
            width: auto;
            padding: 0.7rem 1.2rem;
            margin: 0 0.5rem;
            font-size: 0.9rem;
        }

        .button-group {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin: 0.5rem 2rem 0;
        }

        .result-card {
            margin: 0 2rem 1rem;
            padding: 1.5rem;
            border-radius: 1.5rem;
            background: rgba(249, 250, 249, 0.95);
            border-left: 8px solid #2ecc71;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            backdrop-filter: blur(4px);
        }

        .result-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.1);
        }

        .graph-container {
            margin: 1rem 2rem 2rem;
            padding: 1rem;
            background: #0d1f14;
            border-radius: 1.5rem;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.3), 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .footer {
            background: #eaf4ea;
            padding: 1rem;
            text-align: center;
            font-size: 0.8rem;
            color: #2c5e3c;
            border-top: 1px solid #cde0cd;
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }

        @media (max-width: 720px) {
            body {
                padding: 1rem;
            }

            .btn-modern {
                width: calc(100% - 2rem);
                margin: 0.5rem 1rem;
            }

            .form-grid {
                padding: 1rem;
            }

            .graph-container {
                margin: 1rem;
            }

            .button-group {
                margin: 0.5rem 1rem;
            }
        }

        /* Animaciones de entrada */
        @keyframes fadeSlideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .glass-card,
        .result-card {
            animation: fadeSlideUp 0.6s ease-out;
        }

        .input-group {
            animation: fadeSlideUp 0.4s backwards;
        }

        .input-group:nth-child(1) { animation-delay: 0.05s; }
        .input-group:nth-child(2) { animation-delay: 0.10s; }
        .input-group:nth-child(3) { animation-delay: 0.15s; }
        .input-group:nth-child(4) { animation-delay: 0.20s; }
        .input-group:nth-child(5) { animation-delay: 0.25s; }
        .input-group:nth-child(6) { animation-delay: 0.30s; }
        .input-group:nth-child(7) { animation-delay: 0.35s; }
        .input-group:nth-child(8) { animation-delay: 0.40s; }
        .input-group:nth-child(9) { animation-delay: 0.45s; }
        .input-group:nth-child(10) { animation-delay: 0.50s; }
        .input-group:nth-child(11) { animation-delay: 0.55s; }

        /* Tooltip moderno */
        [data-tooltip] {
            position: relative;
            cursor: help;
        }

        [data-tooltip]:before {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 120%;
            left: 50%;
            transform: translateX(-50%);
            background: #1f3b2c;
            color: #fff;
            padding: 0.4rem 0.8rem;
            border-radius: 0.5rem;
            font-size: 0.7rem;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            z-index: 20;
        }

        [data-tooltip]:hover:before {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="glass-card">
        <div class="header">
            <div class="logo-area">
                <div class="logo-icon"><i class="fas fa-chart-pie"></i></div>
                <div class="title-text">
                    <h1>Segmentación de Contribuyentes</h1>
                    <p>Municipalidad Distrital de Pangoa · K-Means · Análisis de perfiles</p>
                </div>
            </div>
            <div style="color:#e8f0e8; font-weight:600;"><i class="fas fa-brain"></i> Clustering con Weka</div>
        </div>

        <form class="form-grid" id="segmentForm">
            <div class="input-group">
                <label><i class="fas fa-user"></i> Tipo contribuyente</label>
                <select id="tipo">
                    <option value="0">Persona natural</option>
                    <option value="1">Persona jurídica</option>
                </select>
            </div>
            <div class="input-group">
                <label><i class="fas fa-calendar-alt"></i> Frecuencia de pago</label>
                <select id="frecuencia">
                    <option value="0">Puntual</option>
                    <option value="1">Con retraso</option>
                    <option value="2">Nunca paga</option>
                </select>
            </div>
            <div class="input-group">
                <label><i class="fas fa-money-bill-wave"></i> Monto impuesto (S/.)</label>
                <input type="number" step="any" id="montoImpuesto" value="1000" placeholder="Ej: 5000">
            </div>
            <div class="input-group">
                <label><i class="fas fa-hand-holding-usd"></i> Monto pagado (S/.)</label>
                <input type="number" step="any" id="montoPagado" value="500" placeholder="Ej: 800">
            </div>
            <div class="input-group">
                <label><i class="fas fa-chart-line"></i> Deuda acumulada (S/.)</label>
                <input type="number" step="any" id="deudaAcumulada" value="200" placeholder="Ej: 1200">
            </div>
            <div class="input-group">
                <label><i class="fas fa-hourglass-half"></i> Años en morosidad</label>
                <input type="number" id="aniosMoroso" value="0" placeholder="Ej: 2">
            </div>
            <div class="input-group">
                <label><i class="fas fa-clock"></i> Meses retraso promedio</label>
                <input type="number" step="any" id="mesesRetraso" value="0" placeholder="Ej: 3.5">
            </div>
            <div class="input-group">
                <label><i class="fas fa-envelope"></i> N° notificaciones</label>
                <input type="number" id="numNotificaciones" value="0" placeholder="Ej: 2">
            </div>
            <div class="input-group">
                <label><i class="fas fa-reply-all"></i> Respondió notificaciones</label>
                <select id="respondio">
                    <option value="1">Sí</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="input-group">
                <label><i class="fas fa-file-signature"></i> Solicitó fraccionamiento</label>
                <select id="fraccion">
                    <option value="1">Sí</option>
                    <option value="0">No</option>
                </select>
            </div>
            <div class="input-group">
                <label><i class="fas fa-calendar-week"></i> Año último pago</label>
                <input type="number" id="ultimoPago" value="2024" placeholder="Ej: 2023">
            </div>
        </form>

        <div class="button-group">
            <button id="btnSegmentar" class="btn-modern"><i class="fas fa-chart-line"></i> Identificar segmento</button>
            <button id="btnEjemploAlto" class="btn-modern btn-secondary"><i class="fas fa-skull-crosswalk"></i> Ejemplo Alto Riesgo</button>
            <button id="btnEjemploMedio" class="btn-modern btn-secondary"><i class="fas fa-chart-line"></i> Ejemplo Medio Riesgo</button>
            <button id="btnEjemploBajo" class="btn-modern btn-secondary"><i class="fas fa-check-circle"></i> Ejemplo Bajo Riesgo</button>
        </div>

        <div id="resultado" class="result-card">✨ Complete los datos y presione el botón</div>
        <div id="grafico" class="graph-container"></div>
        <div class="footer">
            <span><i class="fas fa-microchip"></i> Modelo Weka · K-Means</span>
            <span><i class="fas fa-chart-pie"></i> Segmentación en 3 grupos</span>
            <span><i class="fas fa-shield-alt"></i> Datos oficiales · Pangoa</span>
        </div>
    </div>

    <script>
        // ========== PARTÍCULAS DE FONDO ==========
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function createParticles() {
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    radius: Math.random() * 2.5 + 1,
                    speedX: (Math.random() - 0.5) * 0.3,
                    speedY: (Math.random() - 0.5) * 0.2,
                    color: `rgba(45, 106, 79, ${Math.random() * 0.4 + 0.1})`
                });
            }
        }

        function drawParticles() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particles) {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                p.x += p.speedX;
                p.y += p.speedY;
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;
                if (p.y < 0) p.y = canvas.height;
                if (p.y > canvas.height) p.y = 0;
            }
            requestAnimationFrame(drawParticles);
        }

        window.addEventListener('resize', () => {
            resizeCanvas();
            createParticles();
        });
        resizeCanvas();
        createParticles();
        drawParticles();

        // ========== CONFIGURACIÓN VISUAL (3 CLUSTERS) ==========
        // Colores: Rojo (Morosos), Amarillo (Recuperables), Verde (Cumplidos)
        const coloresSemanticos = ['#e74c3c', '#f1c40f', '#2ecc71'];
        const nombresSemanticos = [
            'Morosos',
            'Recuperables',
            'Cumplidos'
        ];
        // Posiciones en línea horizontal centrada
        const clusterPositions = [
            { x: 1.0, y: 1.5 },   // Morosos
            { x: 2.0, y: 1.5 },   // Recuperables
            { x: 3.0, y: 1.5 }    // Cumplidos
        ];
        const radio = 0.7;

        let graficoDiv = document.getElementById('grafico');
        let resultadoDiv = document.getElementById('resultado');
        let puntosPorCluster = null;

        // Función para mapear cluster 3 a 1 (Recuperables)
        function mapearCluster(cluster) {
            // Si el backend devuelve 3 (Recuperables alto monto), lo tratamos como 1 (Recuperables)
            if (cluster === 3) return 1;
            return cluster;
        }

        // Cargar puntos históricos y filtrar solo clusters 0,1,2
        async function cargarPuntosHistoricos() {
            try {
                const resp = await fetch('/puntos');
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const puntosData = await resp.json();
                // Filtramos solo clusters 0,1,2 (ignoramos el 3)
                puntosPorCluster = {};
                for (let i = 0; i <= 2; i++) {
                    if (puntosData[i] && puntosData[i].x && puntosData[i].x.length > 0) {
                        puntosPorCluster[i] = puntosData[i];
                    }
                }
                console.log('Puntos históricos cargados (solo 3 clusters)');
                dibujarGrafico(null);
            } catch (err) {
                console.error('Error cargando puntos históricos:', err);
                dibujarGrafico(null);
            }
        }

        function dibujarGrafico(clusterSeleccionado) {
            if (!puntosPorCluster) return;
            let shapes = [];
            let traces = [];

            // 1. Círculos para 3 clusters
            for (let i = 0; i < clusterPositions.length; i++) {
                const pos = clusterPositions[i];
                const color = coloresSemanticos[i];
                const isHighlighted = (clusterSeleccionado !== null && i === clusterSeleccionado);
                const lineWidth = isHighlighted ? 4 : 2;
                const fillOpacity = isHighlighted ? 0.35 : 0.2;

                shapes.push({
                    type: 'circle',
                    xref: 'x', yref: 'y',
                    x0: pos.x - radio, y0: pos.y - radio,
                    x1: pos.x + radio, y1: pos.y + radio,
                    line: { color: color, width: lineWidth },
                    fillcolor: `rgba(${parseInt(color.slice(1,3),16)}, ${parseInt(color.slice(3,5),16)}, ${parseInt(color.slice(5,7),16)}, ${fillOpacity})`,
                    layer: 'below'
                });

                // Etiqueta central
                traces.push({
                    x: [pos.x],
                    y: [pos.y],
                    mode: 'text',
                    text: [`<b>${nombresSemanticos[i]}</b>`],
                    textfont: { size: 12, color: color, weight: 'bold' },
                    showlegend: false,
                    hoverinfo: 'skip',
                    type: 'scatter'
                });
            }

            // 2. Puntos históricos dentro de cada círculo (escalados)
            for (let i = 0; i < clusterPositions.length; i++) {
                const clusterId = i;
                const pts = puntosPorCluster[clusterId];
                if (pts && pts.x && pts.x.length > 0) {
                    const posCentro = clusterPositions[clusterId];
                    const xs = pts.x;
                    const ys = pts.y;
                    const xMin = Math.min(...xs);
                    const xMax = Math.max(...xs);
                    const yMin = Math.min(...ys);
                    const yMax = Math.max(...ys);
                    const xRange = (xMax - xMin) || 1;
                    const yRange = (yMax - yMin) || 1;
                    const scaleX = (radio * 0.9) / xRange;
                    const scaleY = (radio * 0.9) / yRange;
                    const puntosEscaladosX = xs.map(v => posCentro.x + (v - xMin) * scaleX - (radio * 0.9)/2);
                    const puntosEscaladosY = ys.map(v => posCentro.y + (v - yMin) * scaleY - (radio * 0.9)/2);
                    const color = coloresSemanticos[clusterId];
                    traces.push({
                        x: puntosEscaladosX,
                        y: puntosEscaladosY,
                        mode: 'markers',
                        name: `Contribuyentes ${nombresSemanticos[clusterId]}`,
                        marker: { color: color, size: 4, opacity: 0.5, symbol: 'circle' },
                        type: 'scatter',
                        showlegend: false,
                        hoverinfo: 'none'
                    });
                }
            }

            // 3. Estrella del usuario (con mapeo de cluster)
            if (clusterSeleccionado !== null && clusterSeleccionado >= 0 && clusterSeleccionado < clusterPositions.length) {
                const posEstrella = clusterPositions[clusterSeleccionado];
                traces.push({
                    x: [posEstrella.x],
                    y: [posEstrella.y - 0.15],
                    mode: 'markers+text',
                    name: '⭐ Contribuyente actual',
                    text: ['  Tú'],
                    textposition: 'middle right',
                    textfont: { size: 13, color: '#ffd966', weight: 'bold' },
                    marker: { symbol: 'star', size: 28, color: '#ffd966', line: { width: 2, color: '#fff' } },
                    type: 'scatter',
                    hoverinfo: 'text',
                    hovertemplate: `⭐ Pertenece a ${nombresSemanticos[clusterSeleccionado]}<extra></extra>`,
                    legendgroup: 'usuario'
                });
            }

            const layout = {
                title: {
                    text: 'Grupos de contribuyentes · Segmentación por K-Means',
                    font: { size: 18, color: '#a8dfc0', weight: 'bold' },
                    x: 0.5,
                    xanchor: 'center'
                },
                plot_bgcolor: '#0d1f14',
                paper_bgcolor: '#0d1f14',
                font: { color: '#a8dfc0' },
                xaxis: {
                    showgrid: false,
                    zeroline: false,
                    showticklabels: false,
                    range: [0.4, 3.6],
                    fixedrange: false
                },
                yaxis: {
                    showgrid: false,
                    zeroline: false,
                    showticklabels: false,
                    range: [0.5, 2.5],
                    scaleanchor: 'x',
                    scaleratio: 1,
                    fixedrange: false
                },
                height: 450,
                margin: { l: 20, r: 20, t: 60, b: 20 },
                hovermode: 'closest',
                legend: {
                    bgcolor: 'rgba(0,0,0,0.65)',
                    bordercolor: 'rgba(255,255,255,0.2)',
                    borderwidth: 1,
                    font: { size: 11 },
                    x: 1.02,
                    y: 1,
                    xanchor: 'left',
                    yanchor: 'top'
                },
                shapes: shapes,
                autosize: true,
                responsive: true
            };
            
            Plotly.react(graficoDiv, traces, layout, { responsive: true });
        }

        // Redimensionado
        window.addEventListener('resize', () => {
            if (graficoDiv && graficoDiv.data) {
                Plotly.relayout(graficoDiv, { autosize: true });
                Plotly.Plots.resize(graficoDiv);
            }
        });

        // EJEMPLOS
        function cargarEjemploAlto() {
            document.getElementById('tipo').value = "0";
            document.getElementById('frecuencia').value = "2";
            document.getElementById('montoImpuesto').value = "8000";
            document.getElementById('montoPagado').value = "0";
            document.getElementById('deudaAcumulada').value = "15000";
            document.getElementById('aniosMoroso').value = "5";
            document.getElementById('mesesRetraso').value = "12";
            document.getElementById('numNotificaciones').value = "8";
            document.getElementById('respondio').value = "0";
            document.getElementById('fraccion').value = "0";
            document.getElementById('ultimoPago').value = "2018";
            resultadoDiv.innerHTML = "📋 Ejemplo de Alto Riesgo cargado. Presione 'Identificar segmento' para ver el resultado.";
            resultadoDiv.style.borderLeftColor = "#e74c3c";
        }

        function cargarEjemploMedio() {
            document.getElementById('tipo').value = "0";
            document.getElementById('frecuencia').value = "1";
            document.getElementById('montoImpuesto').value = "3500";
            document.getElementById('montoPagado').value = "1800";
            document.getElementById('deudaAcumulada').value = "2200";
            document.getElementById('aniosMoroso').value = "2";
            document.getElementById('mesesRetraso').value = "4";
            document.getElementById('numNotificaciones').value = "3";
            document.getElementById('respondio').value = "0";
            document.getElementById('fraccion').value = "1";
            document.getElementById('ultimoPago').value = "2022";
            resultadoDiv.innerHTML = "📋 Ejemplo de Medio Riesgo cargado. Presione 'Identificar segmento' para ver el resultado.";
            resultadoDiv.style.borderLeftColor = "#f1c40f";
        }

        function cargarEjemploBajo() {
            document.getElementById('tipo').value = "0";
            document.getElementById('frecuencia').value = "0";
            document.getElementById('montoImpuesto').value = "3500";
            document.getElementById('montoPagado').value = "3500";
            document.getElementById('deudaAcumulada').value = "0";
            document.getElementById('aniosMoroso').value = "0";
            document.getElementById('mesesRetraso').value = "0";
            document.getElementById('numNotificaciones').value = "0";
            document.getElementById('respondio').value = "1";
            document.getElementById('fraccion').value = "0";
            document.getElementById('ultimoPago').value = "2025";
            resultadoDiv.innerHTML = "📋 Ejemplo de Bajo Riesgo cargado. Presione 'Identificar segmento' para ver el resultado.";
            resultadoDiv.style.borderLeftColor = "#2ecc71";
        }

        // Segmentar contribuyente
        async function segmentar() {
            const btn = document.getElementById('btnSegmentar');
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Procesando...';
            btn.disabled = true;

            const datos = {
                tipoContribuyente: parseInt(document.getElementById('tipo').value),
                frecuenciaPago: parseInt(document.getElementById('frecuencia').value),
                montoImpuesto: parseFloat(document.getElementById('montoImpuesto').value),
                montoPagado: parseFloat(document.getElementById('montoPagado').value),
                deudaAcumulada: parseFloat(document.getElementById('deudaAcumulada').value),
                aniosMoroso: parseInt(document.getElementById('aniosMoroso').value),
                mesesRetrasoPromedio: parseFloat(document.getElementById('mesesRetraso').value),
                numNotificaciones: parseInt(document.getElementById('numNotificaciones').value),
                respondioNotificacion: parseInt(document.getElementById('respondio').value),
                fraccionamiento: parseInt(document.getElementById('fraccion').value),
                ultimoPago: parseInt(document.getElementById('ultimoPago').value)
            };

            if (datos.montoPagado > datos.montoImpuesto && datos.montoImpuesto > 0) {
                resultadoDiv.innerHTML = '<div style="color:#c5221f;">⚠️ El monto pagado no puede superar al impuesto.</div>';
                btn.innerHTML = originalHtml;
                btn.disabled = false;
                return;
            }

            try {
                const response = await fetch('/segmentar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(datos)
                });
                if (!response.ok) throw new Error('Error en el servidor');
                const res = await response.json();
                if (res.error) throw new Error(res.error);

                let cluster = res.cluster;
                // Mapeamos cluster 3 a 1 (Recuperables)
                cluster = mapearCluster(cluster);

                const info = res.info || {};
                // Si venía de cluster 3, usamos información de recuperables (cluster 1)
                let nombre, desc, accion, caracteristicas;
                if (res.cluster === 3) {
                    // Forzamos información del cluster 1
                    nombre = 'Segmento 1: Recuperables';
                    desc = 'Contribuyentes con deuda pero que han realizado pagos parciales.';
                    accion = 'Ofrecer plan de fraccionamiento y orientación tributaria.';
                    caracteristicas = [
                        'Deuda promedio: S/. 1766.83',
                        'Han realizado pagos parciales',
                        'Potencial de regularización'
                    ];
                } else {
                    nombre = info.nombre || `Segmento ${cluster}`;
                    desc = info.descripcion || '';
                    accion = info.accion || 'Revisar historial.';
                    caracteristicas = info.caracteristicas || [];
                }

                let caracHtml = '';
                if (caracteristicas.length) {
                    caracHtml = '<ul style="text-align:left;display:inline-block;margin:12px 0;">' +
                        caracteristicas.map(c => `<li style="margin:6px 0;">${c}</li>`).join('') + '</ul>';
                }

                const colorTexto = coloresSemanticos[cluster] || '#1f7a46';
                resultadoDiv.innerHTML = `
                    <h2 style="color:${colorTexto}; margin-bottom:8px;">${nombre}</h2>
                    <p style="margin-bottom:8px;">${desc}</p>
                    ${caracHtml}
                    <p><strong style="color:${colorTexto};">⚡ Acción recomendada:</strong> ${accion}</p>
                    <p style="font-size:0.8rem; margin-top:12px;">Cluster #${cluster}</p>
                `;
                resultadoDiv.style.borderLeftColor = colorTexto;

                dibujarGrafico(cluster);
            } catch (err) {
                resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error: ${err.message}</div>`;
                console.error(err);
            } finally {
                btn.innerHTML = originalHtml;
                btn.disabled = false;
            }
        }

        // Inicialización
        cargarPuntosHistoricos();
        document.getElementById('btnSegmentar').addEventListener('click', segmentar);
        document.getElementById('btnEjemploAlto').addEventListener('click', cargarEjemploAlto);
        document.getElementById('btnEjemploMedio').addEventListener('click', cargarEjemploMedio);
        document.getElementById('btnEjemploBajo').addEventListener('click', cargarEjemploBajo);
    </script>
</body>
</html>
