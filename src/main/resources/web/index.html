<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Segmentación de Contribuyentes | Pangoa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.plot.ly/plotly-2.27.1.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #e0f0e0 0%, #c8e0c8 100%); font-family: 'Inter', sans-serif; padding: 2rem 1.5rem; }
        .glass-card { max-width: 1400px; margin: 0 auto; background: rgba(255,255,255,0.96); backdrop-filter: blur(2px); border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: linear-gradient(105deg, #0e4b2c 0%, #1a6e3a 100%); padding: 1.2rem 2rem; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; border-bottom: 3px solid #ffd966; }
        .logo-area { display: flex; align-items: center; gap: 1rem; }
        .logo-icon { background: #f5f5dc; border-radius: 50%; width: 55px; height: 55px; display: flex; align-items: center; justify-content: center; font-size: 2rem; color: #0e4b2c; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .title-text h1 { color: white; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.3px; }
        .title-text p { color: #d4ecd4; font-size: 0.9rem; font-weight: 500; }
        .form-grid { padding: 1.5rem 2rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.3rem; }
        .input-group label { font-weight: 700; color: #1f3b2c; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; gap: 0.5rem; }
        .input-group input, .input-group select { padding: 0.75rem 1rem; border: 1.5px solid #e2e8f0; border-radius: 1rem; font-size: 0.95rem; background: #fefefe; transition: all 0.2s; }
        .input-group input:focus, .input-group select:focus { border-color: #2d6a4f; outline: none; box-shadow: 0 0 0 3px rgba(45,106,79,0.2); }
        .btn-modern { background: linear-gradient(95deg, #14532d, #1f7a46); border: none; color: white; font-weight: 800; padding: 0.9rem; border-radius: 2rem; cursor: pointer; font-size: 1rem; margin: 0.5rem 2rem 1rem; width: calc(100% - 4rem); transition: 0.3s; box-shadow: 0 6px 14px rgba(0,0,0,0.15); }
        .btn-modern:hover { transform: translateY(-2px); background: linear-gradient(95deg, #0f4624, #186e3a); box-shadow: 0 12px 22px rgba(0,0,0,0.2); }
        .result-card { margin: 0 2rem 1rem; padding: 1.5rem; border-radius: 1.5rem; background: #f9faf9; border-left: 8px solid #2ecc71; text-align: center; transition: transform 0.2s; }
        .result-card:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .graph-container { margin: 1rem 2rem 2rem; padding: 1rem; background: #0d1f14; border-radius: 1.5rem; }
        .footer { background: #eaf4ea; padding: 1rem; text-align: center; font-size: 0.8rem; color: #2c5e3c; border-top: 1px solid #cde0cd; }
        @media (max-width: 720px) { body { padding: 1rem; } .btn-modern { width: calc(100% - 2rem); margin: 0.5rem 1rem; } .form-grid { padding: 1rem; } .graph-container { margin: 1rem; } }
    </style>
</head>
<body>
<div class="glass-card">
    <div class="header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-chart-pie"></i></div>
            <div class="title-text">
                <h1>Segmentación de Contribuyentes</h1>
                <p>Municipalidad Distrital de Pangoa · K-Means + PCA · Elipses de confianza</p>
            </div>
        </div>
        <div style="color:#e8f0e8; font-weight:600;"><i class="fas fa-brain"></i> Clustering con Weka</div>
    </div>

    <form class="form-grid" id="segmentForm">
        <div class="input-group"><label><i class="fas fa-user"></i> Tipo contribuyente</label><select id="tipo"><option value="0">Persona natural</option><option value="1">Persona jurídica</option></select></div>
        <div class="input-group"><label><i class="fas fa-calendar-alt"></i> Frecuencia de pago</label><select id="frecuencia"><option value="0">Puntual</option><option value="1">Con retraso</option><option value="2">Nunca paga</option></select></div>
        <div class="input-group"><label><i class="fas fa-money-bill-wave"></i> Monto impuesto (S/.)</label><input type="number" step="any" id="montoImpuesto" value="1000"></div>
        <div class="input-group"><label><i class="fas fa-hand-holding-usd"></i> Monto pagado (S/.)</label><input type="number" step="any" id="montoPagado" value="500"></div>
        <div class="input-group"><label><i class="fas fa-chart-line"></i> Deuda acumulada (S/.)</label><input type="number" step="any" id="deudaAcumulada" value="200"></div>
        <div class="input-group"><label><i class="fas fa-hourglass-half"></i> Años en morosidad</label><input type="number" id="aniosMoroso" value="0"></div>
        <div class="input-group"><label><i class="fas fa-clock"></i> Meses retraso promedio</label><input type="number" step="any" id="mesesRetraso" value="0"></div>
        <div class="input-group"><label><i class="fas fa-envelope"></i> N° notificaciones</label><input type="number" id="numNotificaciones" value="0"></div>
        <div class="input-group"><label><i class="fas fa-reply-all"></i> Respondió notificaciones</label><select id="respondio"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div class="input-group"><label><i class="fas fa-file-signature"></i> Solicitó fraccionamiento</label><select id="fraccion"><option value="1">Sí</option><option value="0">No</option></select></div>
        <div class="input-group"><label><i class="fas fa-calendar-week"></i> Año último pago</label><input type="number" id="ultimoPago" value="2024"></div>
    </form>

    <button id="btnSegmentar" class="btn-modern"><i class="fas fa-chart-line"></i> Identificar segmento</button>
    <div id="resultado" class="result-card">✨ Complete los datos y presione el botón</div>
    <div id="grafico" class="graph-container"></div>
    <div class="footer">
        <span><i class="fas fa-microchip"></i> Modelo Weka · K-Means</span>
        <span> &nbsp;·&nbsp; </span>
        <span><i class="fas fa-chart-pie"></i> Segmentación en 4 grupos</span>
        <span> &nbsp;·&nbsp; </span>
        <span><i class="fas fa-shield-alt"></i> Datos oficiales · Pangoa</span>
    </div>
</div>

<script>
    let puntosData = null;         // datos originales del servidor
    let puntosLimpios = null;      // datos sin outliers para el gráfico
    let graficoDiv = document.getElementById('grafico');
    let resultadoDiv = document.getElementById('resultado');

    const COLORES = ['#2ecc71', '#f1c40f', '#e74c3c', '#3498db'];
    const NOMBRES = [
        'Segmento 0: Morosos',
        'Segmento 1: Recuperables',
        'Segmento 2: Cumplidos',
        'Segmento 3: Recuperables alto monto'
    ];

    // ── Filtrar outliers por z-score (umbral = 3 σ) ──────────────────────────
    function filtrarOutliers(pts, umbral = 3.0) {
        if (!pts.x || pts.x.length < 5) return pts;
        const n = pts.x.length;

        const meanX = pts.x.reduce((a, b) => a + b, 0) / n;
        const meanY = pts.y.reduce((a, b) => a + b, 0) / n;
        const stdX  = Math.sqrt(pts.x.reduce((s, v) => s + (v - meanX) ** 2, 0) / n) || 1;
        const stdY  = Math.sqrt(pts.y.reduce((s, v) => s + (v - meanY) ** 2, 0) / n) || 1;

        const xFilt = [], yFilt = [];
        for (let i = 0; i < n; i++) {
            const zx = Math.abs((pts.x[i] - meanX) / stdX);
            const zy = Math.abs((pts.y[i] - meanY) / stdY);
            if (zx <= umbral && zy <= umbral) {
                xFilt.push(pts.x[i]);
                yFilt.push(pts.y[i]);
            }
        }
        return { x: xFilt, y: yFilt };
    }

    // ── Elipse de confianza 95 % ─────────────────────────────────────────────
    function calcularElipse(pts) {
        if (!pts.x || pts.x.length < 5) return null;
        const n = pts.x.length;
        const cx = pts.x.reduce((a, b) => a + b, 0) / n;
        const cy = pts.y.reduce((a, b) => a + b, 0) / n;
        let covXX = 0, covYY = 0, covXY = 0;
        for (let i = 0; i < n; i++) {
            const dx = pts.x[i] - cx, dy = pts.y[i] - cy;
            covXX += dx * dx; covYY += dy * dy; covXY += dx * dy;
        }
        covXX /= (n - 1); covYY /= (n - 1); covXY /= (n - 1);

        const chi2 = 5.991;
        const disc = Math.sqrt(Math.pow(covXX - covYY, 2) + 4 * covXY * covXY);
        const w = Math.sqrt(Math.max(0, chi2 * (covXX + covYY + disc) / 2));
        const h = Math.sqrt(Math.max(0, chi2 * (covXX + covYY - disc) / 2));
        return { cx, cy, w: Math.max(w, 0.01), h: Math.max(h, 0.01) };
    }

    // ── Calcular rangos incluyendo elipses y la estrella del usuario ─────────
    function calcularRanges(datos, puntoExtra) {
        let allX = [], allY = [];
        for (const pts of Object.values(datos)) {
            if (pts.x) { allX.push(...pts.x); allY.push(...pts.y); }
            const e = calcularElipse(pts);
            if (e) { allX.push(e.cx - e.w, e.cx + e.w); allY.push(e.cy - e.h, e.cy + e.h); }
        }
        // La estrella se incluye SOLO si está razonablemente cerca (< 5× el rango actual)
        if (puntoExtra) {
            const xMin0 = Math.min(...allX), xMax0 = Math.max(...allX);
            const yMin0 = Math.min(...allY), yMax0 = Math.max(...allY);
            const xRng = (xMax0 - xMin0) || 1, yRng = (yMax0 - yMin0) || 1;
            const factorMax = 3;
            if (Math.abs(puntoExtra.x - (xMin0 + xMax0) / 2) < factorMax * xRng &&
                Math.abs(puntoExtra.y - (yMin0 + yMax0) / 2) < factorMax * yRng) {
                allX.push(puntoExtra.x);
                allY.push(puntoExtra.y);
            }
        }
        const xMin = Math.min(...allX), xMax = Math.max(...allX);
        const yMin = Math.min(...allY), yMax = Math.max(...allY);
        const mx = (xMax - xMin) * 0.18 || 1;
        const my = (yMax - yMin) * 0.18 || 1;
        return { x: [xMin - mx, xMax + mx], y: [yMin - my, yMax + my] };
    }

    // ── Dibujar gráfico ───────────────────────────────────────────────────────
    function dibujarGrafico(clusterResaltado, puntoUsuario) {
        if (!puntosLimpios) return;
        const ranges = calcularRanges(puntosLimpios, puntoUsuario);
        let traces = [], shapes = [];

        // 1) Elipses
        for (const [cluster, pts] of Object.entries(puntosLimpios)) {
            const idx = parseInt(cluster);
            const e = calcularElipse(pts);
            if (!e) continue;
            const col = COLORES[idx % COLORES.length];
            const [r, g, b] = [parseInt(col.slice(1,3),16), parseInt(col.slice(3,5),16), parseInt(col.slice(5,7),16)];
            const resaltado = clusterResaltado !== null && idx === clusterResaltado;
            shapes.push({
                type: 'ellipse', xref: 'x', yref: 'y',
                x0: e.cx - e.w, x1: e.cx + e.w,
                y0: e.cy - e.h, y1: e.cy + e.h,
                line: { color: col, width: resaltado ? 4 : 2 },
                fillcolor: `rgba(${r},${g},${b},${resaltado ? 0.30 : 0.18})`,
                layer: 'below'
            });
            // Etiqueta en centroide
            traces.push({
                x: [e.cx], y: [e.cy],
                mode: 'text',
                text: [`<b>${NOMBRES[idx].split(':')[0]}</b>`],
                textfont: { size: 10, color: col },
                showlegend: false, hoverinfo: 'skip', type: 'scatter'
            });
        }

        // 2) Nubes de puntos
        for (const [cluster, pts] of Object.entries(puntosLimpios)) {
            const idx = parseInt(cluster);
            if (!pts.x || pts.x.length === 0) continue;
            const col = COLORES[idx % COLORES.length];
            const resaltado = clusterResaltado !== null && idx === clusterResaltado;
            traces.push({
                x: pts.x, y: pts.y,
                mode: 'markers',
                name: NOMBRES[idx],
                marker: { color: col, size: resaltado ? 9 : 6, opacity: resaltado ? 0.95 : 0.60, line: { width: 0.4, color: 'rgba(255,255,255,0.3)' } },
                type: 'scatter',
                hoverinfo: 'text',
                text: pts.x.map(() => NOMBRES[idx]),
                legendgroup: `c${idx}`
            });
        }

        // 3) Estrella del usuario
        if (puntoUsuario) {
            // Verificar si la estrella está dentro del rango visible
            const dentroX = puntoUsuario.x >= ranges.x[0] && puntoUsuario.x <= ranges.x[1];
            const dentroY = puntoUsuario.y >= ranges.y[0] && puntoUsuario.y <= ranges.y[1];
            const visible = dentroX && dentroY;
            traces.push({
                x: [visible ? puntoUsuario.x : null],
                y: [visible ? puntoUsuario.y : null],
                mode: 'markers+text',
                name: '⭐ Contribuyente actual',
                text: ['  ◀ Tú'],
                textposition: 'middle right',
                textfont: { size: 13, color: '#ffd966' },
                marker: { symbol: 'star', size: 28, color: '#ffd966', line: { width: 2.5, color: '#fff' } },
                type: 'scatter',
                hovertemplate: '⭐ Tu contribuyente<br>PC1: %{x:.3f}<br>PC2: %{y:.3f}<extra></extra>',
                legendgroup: 'usuario'
            });
            if (!visible) {
                console.warn('⚠️ La estrella está fuera del rango visible. Probable error en pca_params.json.',
                    `pcaX=${puntoUsuario.x.toFixed(2)}, pcaY=${puntoUsuario.y.toFixed(2)}`,
                    `rangoX=[${ranges.x.map(v=>v.toFixed(1)).join(',')}]`,
                    `rangoY=[${ranges.y.map(v=>v.toFixed(1)).join(',')}]`
                );
            }
        }

        Plotly.newPlot(graficoDiv, traces, {
            title: { text: 'Mapa de perfiles de contribuyentes (PCA) — Elipses de confianza 95%', font: { color: '#a8dfc0', size: 14 } },
            plot_bgcolor: '#0d1f14', paper_bgcolor: '#0d1f14',
            font: { color: '#a8dfc0' },
            xaxis: { title: 'Componente Principal 1', showgrid: true, gridcolor: 'rgba(255,255,255,0.07)', zeroline: false, range: ranges.x },
            yaxis: { title: 'Componente Principal 2', showgrid: true, gridcolor: 'rgba(255,255,255,0.07)', zeroline: false, range: ranges.y },
            height: 560,
            margin: { l: 65, r: 170, t: 55, b: 65 },
            hovermode: 'closest',
            legend: { bgcolor: 'rgba(0,0,0,0.65)', bordercolor: 'rgba(255,255,255,0.2)', borderwidth: 1, font: { size: 11 }, x: 1.01, y: 1, xanchor: 'left', yanchor: 'top' },
            shapes: shapes
        }, { responsive: true });
    }

    // ── Cargar puntos y filtrar outliers ──────────────────────────────────────
    async function cargarPuntos() {
        try {
            const resp = await fetch('/puntos');
            if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
            puntosData = await resp.json();

            // Filtrar outliers para que el gráfico se vea bien
            puntosLimpios = {};
            for (const [k, pts] of Object.entries(puntosData)) {
                puntosLimpios[k] = filtrarOutliers(pts, 3.0);
            }

            const tieneData = Object.values(puntosLimpios).some(c => c.x && c.x.length > 0);
            if (!tieneData) {
                resultadoDiv.innerHTML = '<div style="color:#e74c3c;">⚠️ No hay datos en puntos_por_cluster.json</div>';
                return;
            }
            dibujarGrafico(null, null);
        } catch (err) {
            console.error(err);
            resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error cargando gráfico: ${err.message}</div>`;
        }
    }

    // ── Segmentar contribuyente ───────────────────────────────────────────────
    async function segmentar() {
        const btn = document.getElementById('btnSegmentar');
        const orig = btn.innerHTML;
        btn.innerHTML = '<i class="fas fa-spinner fa-pulse"></i> Procesando...';
        btn.disabled = true;

        const datos = {
            tipoContribuyente:     parseInt(document.getElementById('tipo').value),
            frecuenciaPago:        parseInt(document.getElementById('frecuencia').value),
            montoImpuesto:         parseFloat(document.getElementById('montoImpuesto').value),
            montoPagado:           parseFloat(document.getElementById('montoPagado').value),
            deudaAcumulada:        parseFloat(document.getElementById('deudaAcumulada').value),
            aniosMoroso:           parseInt(document.getElementById('aniosMoroso').value),
            mesesRetrasoPromedio:  parseFloat(document.getElementById('mesesRetraso').value),
            numNotificaciones:     parseInt(document.getElementById('numNotificaciones').value),
            respondioNotificacion: parseInt(document.getElementById('respondio').value),
            fraccionamiento:       parseInt(document.getElementById('fraccion').value),
            ultimoPago:            parseInt(document.getElementById('ultimoPago').value)
        };

        if (datos.montoPagado > datos.montoImpuesto && datos.montoImpuesto > 0) {
            resultadoDiv.innerHTML = '<div style="color:#c5221f;">⚠️ El monto pagado no puede superar al impuesto.</div>';
            btn.innerHTML = orig; btn.disabled = false;
            return;
        }

        try {
            const response = await fetch('/segmentar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });
            if (!response.ok) throw new Error('Error en el servidor');
            const res = await response.json();
            if (res.error) throw new Error(res.error);

            const info    = res.info || {};
            const nombre  = info.nombre       || `Segmento ${res.cluster}`;
            const desc    = info.descripcion  || '';
            const accion  = info.accion       || 'Revisar historial.';
            const carac   = info.caracteristicas || [];
            const caracHtml = carac.length
                ? '<ul style="text-align:left;display:inline-block;margin:12px 0;">'
                  + carac.map(c => `<li style="margin:6px 0;">${c}</li>`).join('') + '</ul>'
                : '';

            resultadoDiv.innerHTML = `
                <h2 style="color:#1f7a46;margin-bottom:8px;">${nombre}</h2>
                <p style="margin-bottom:8px;">${desc}</p>
                ${caracHtml}
                <p><strong>⚡ Acción recomendada:</strong> ${accion}</p>
                <p style="font-size:0.8rem;margin-top:12px;">Cluster #${res.cluster}</p>
            `;

            const puntoUsuario = (typeof res.pcaX === 'number' && typeof res.pcaY === 'number')
                ? { x: res.pcaX, y: res.pcaY } : null;

            dibujarGrafico(res.cluster, puntoUsuario);

            if (!puntoUsuario) {
                console.warn('⚠️ Backend no devolvió pcaX/pcaY. Verifica pca_params.json.');
            }
        } catch (err) {
            resultadoDiv.innerHTML = `<div style="color:#c5221f;">❌ Error: ${err.message}</div>`;
            console.error(err);
        } finally {
            btn.innerHTML = orig;
            btn.disabled = false;
        }
    }

    cargarPuntos();
    document.getElementById('btnSegmentar').addEventListener('click', segmentar);
</script>
</body>
</html>
